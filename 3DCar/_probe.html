<!DOCTYPE html>
<html><body><pre id="o"></pre>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.169.0/build/three.module.js';
const WHEEL_R = 0.345, AXLE_F = 1.262, ARCH_F = 0.372, BOTTOM = 0.190;
const archFEnd = Math.asin((BOTTOM - WHEEL_R) / ARCH_F);
const s = new THREE.Shape();
s.moveTo(0.500, 0.845);
s.quadraticCurveTo(0.700, 0.826, 0.930, 0.828);
s.quadraticCurveTo(1.110, 0.852, 1.340, 0.916);
s.quadraticCurveTo(1.600, 0.902, 1.840, 0.816);
s.quadraticCurveTo(2.030, 0.752, 2.150, 0.668);
const geo = new THREE.ExtrudeGeometry(s, {
    depth: 1.410, bevelEnabled: true, bevelThickness: 0.200, bevelSize: 0.055,
    bevelSegments: 6, curveSegments: 28, steps: 1,
});
geo.translate(0, 0, -0.705);
const p = geo.attributes.position;
let maxAbsZ = 0;
const bins = {};
for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    maxAbsZ = Math.max(maxAbsZ, Math.abs(z));
    if (Math.abs(x - 1.340) < 0.03) {
        const k = Math.round(Math.abs(z) * 20) / 20;
        bins[k] = Math.max(bins[k] || -9, y);
    }
}
const out = ['maxAbsZ ' + maxAbsZ.toFixed(3), 'max y near x=1.34, binned by |z|:'];
for (const k of Object.keys(bins).sort((a, b) => a - b)) out.push('  |z|~' + k + '  ymax=' + bins[k].toFixed(3));
document.getElementById('o').textContent = out.join('\n');
console.log(out.join('\n'));
</script>
</body></html>
